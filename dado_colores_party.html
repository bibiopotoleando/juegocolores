<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dado de colores</title>
<style>
  :root{
    --bg1:#fff7e8;
    --bg2:#f6e2be;
    --text:#3b281b;
    --shadow:rgba(59,40,27,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at top, rgba(255,255,255,.85), transparent 35%),
      linear-gradient(145deg,var(--bg1),var(--bg2));
    padding:22px;
    overflow:hidden;
  }
  .app{
    width:min(92vw,520px);
    text-align:center;
    user-select:none;
  }
  h1{
    margin:0 0 8px;
    font-size:clamp(2rem,8vw,4rem);
    line-height:1;
  }
  .subtitle{
    margin:0 0 26px;
    opacity:.72;
    font-size:clamp(.95rem,3.8vw,1.1rem);
  }
  .dice-wrap{
    perspective:900px;
    display:flex;
    justify-content:center;
    margin:10px 0 24px;
  }
  button.dice{
    width:min(68vw,270px);
    aspect-ratio:1/1;
    border:0;
    border-radius:34px;
    color:white;
    box-shadow:0 26px 50px var(--shadow), inset 0 0 0 8px rgba(255,255,255,.22), inset 0 -18px 35px rgba(0,0,0,.18);
    cursor:pointer;
    transform-style:preserve-3d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:18px;
    background:linear-gradient(145deg,#2fbf71,#139955);
    transition:transform .15s ease, filter .2s ease, background .25s ease;
  }
  button.dice:active{ transform:scale(.96) rotateX(4deg); }
  .dice.rolling{
    animation:roll .78s cubic-bezier(.22,.8,.25,1);
    filter:saturate(1.15);
  }
  @keyframes roll{
    0%{transform:rotate(0) scale(1);}
    18%{transform:rotate(35deg) rotateX(45deg) scale(.94);}
    40%{transform:rotate(-28deg) rotateY(70deg) scale(1.06);}
    62%{transform:rotate(24deg) rotateX(-55deg) scale(.98);}
    82%{transform:rotate(-10deg) rotateY(-35deg) scale(1.03);}
    100%{transform:rotate(0) scale(1);}
  }
  .emoji{font-size:clamp(3rem,16vw,5.8rem);line-height:1;text-shadow:0 5px 12px rgba(0,0,0,.18);}
  .color-name{font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(1rem,4vw,1.35rem);opacity:.95;}
  .category{
    font-size:clamp(1.4rem,7vw,2.45rem);
    font-weight:950;
    line-height:1.05;
    text-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .result-card{
    min-height:96px;
    background:rgba(255,255,255,.56);
    border:1px solid rgba(255,255,255,.75);
    border-radius:26px;
    box-shadow:0 14px 34px rgba(59,40,27,.12);
    padding:18px 18px 16px;
    backdrop-filter:blur(10px);
  }
  .result-title{
    margin:0;
    font-weight:950;
    font-size:clamp(1.25rem,5.5vw,2rem);
  }
  .result-rule{
    margin:8px 0 0;
    font-size:clamp(.95rem,3.8vw,1.08rem);
    opacity:.75;
  }
  .hint{
    margin-top:18px;
    font-size:.9rem;
    opacity:.58;
  }
</style>
</head>
<body>
  <main class="app">
    <h1>🎲 Dado de colores</h1>
    <p class="subtitle">Pulsa el dado para elegir categoría</p>

    <div class="dice-wrap">
      <button class="dice" id="dice" aria-label="Lanzar dado">
        <div class="emoji" id="emoji">🌍</div>
        <div class="color-name" id="colorName">Verde</div>
        <div class="category" id="category">Trivia</div>
      </button>
    </div>

    <section class="result-card">
      <p class="result-title" id="resultTitle">🟢 Verde — Trivia</p>
      <p class="result-rule" id="resultRule">Pregunta de Trivia de viajes. Acierto +2, rebote +1.</p>
    </section>

    <p class="hint">Probabilidad igual para las 6 categorías.</p>
  </main>

<script>
const categories = [
  {
    colorName: "Verde",
    category: "Trivia",
    emoji: "🌍",
    title: "🟢 Verde — Trivia",
    rule: "Pregunta de Trivia de viajes. Acierto +2, rebote +1.",
    bg: "linear-gradient(145deg,#34c77b,#0b9350)"
  },
  {
    colorName: "Rojo",
    category: "Adivina palabra",
    emoji: "🗣️",
    title: "🔴 Rojo — Adivina palabra",
    rule: "Describe sin decir las prohibidas. Acierto +2, robo +1.",
    bg: "linear-gradient(145deg,#ff665f,#d72d2d)"
  },
  {
    colorName: "Morado",
    category: "Canciones",
    emoji: "🎵",
    title: "🟣 Morado — Canciones",
    rule: "Canta, tararea o actúa. Normal +2, rapidísimo +3.",
    bg: "linear-gradient(145deg,#9d67ff,#6735d8)"
  },
  {
    colorName: "Amarillo",
    category: "Dixit",
    emoji: "🖼️",
    title: "🟡 Amarillo — Dixit",
    rule: "Ronda creativa con carta visual. Más votos +3, segundo +1.",
    bg: "linear-gradient(145deg,#ffd84a,#f0a900)"
  },
  {
    colorName: "Azul",
    category: "Decisiones",
    emoji: "💭",
    title: "🔵 Azul — Decisiones",
    rule: "Qué prefieres / Cuál elegirías. Mejor respuesta +3, segundo +1.",
    bg: "linear-gradient(145deg,#48a7ff,#1766db)"
  },
  {
    colorName: "Rosa",
    category: "Caos",
    emoji: "🍻",
    title: "🩷 Rosa — Caos",
    rule: "Bebe y diviértete: reto, evento o caos de la carta.",
    bg: "linear-gradient(145deg,#ff7ab6,#e13f87)"
  }
];

const dice = document.getElementById("dice");
const emoji = document.getElementById("emoji");
const colorName = document.getElementById("colorName");
const category = document.getElementById("category");
const resultTitle = document.getElementById("resultTitle");
const resultRule = document.getElementById("resultRule");
let rolling = false;

function paint(item){
  dice.style.background = item.bg;
  emoji.textContent = item.emoji;
  colorName.textContent = item.colorName;
  category.textContent = item.category;
  resultTitle.textContent = item.title;
  resultRule.textContent = item.rule;
}

function roll(){
  if(rolling) return;
  rolling = true;
  dice.classList.add("rolling");

  let ticks = 0;
  const flicker = setInterval(() => {
    paint(categories[Math.floor(Math.random() * categories.length)]);
    ticks++;
    if(ticks >= 10){
      clearInterval(flicker);
      const finalItem = categories[Math.floor(Math.random() * categories.length)];
      paint(finalItem);
      setTimeout(() => {
        dice.classList.remove("rolling");
        rolling = false;
      }, 160);
    }
  }, 70);
}

dice.addEventListener("click", roll);
dice.addEventListener("touchend", (e) => { e.preventDefault(); roll(); }, {passive:false});
</script>
</body>
</html>
